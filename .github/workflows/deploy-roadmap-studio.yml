name: Deploy Roadmap Studio

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.roadmap-studio/deploy.trigger'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify Roadmap Studio bundle
        shell: bash
        run: |
          cat .roadmap-studio/fix04.a .roadmap-studio/fix04.b .roadmap-studio/fix04.c .roadmap-studio/fix04.d > /tmp/fix04
          cat .roadmap-studio/fix08.a .roadmap-studio/fix08.b .roadmap-studio/fix08.c .roadmap-studio/fix08.d > /tmp/fix08
          echo "d264bd697aece0aa27a603aedbeb7f7386dcb2772c151387f96e0f19d8b10187  /tmp/fix04" | sha256sum -c -
          echo "003228d8801a703989efb3f0917b18bc0c1d5c908f29576a1e4a3741bc3cac7c  /tmp/fix08" | sha256sum -c -

          cat \
            .roadmap-studio/source.part01 \
            .roadmap-studio/source.part02 \
            .roadmap-studio/source.part03 \
            .roadmap-studio/source.part04 \
            .roadmap-studio/source.part05 \
            .roadmap-studio/tail.part01 \
            .roadmap-studio/tail.part02 \
            .roadmap-studio/tail.part03 \
            /tmp/fix04 \
            .roadmap-studio/tail.part05 \
            .roadmap-studio/tail.part06 \
            .roadmap-studio/tail.part07 \
            /tmp/fix08 \
            .roadmap-studio/tail.part09 > /tmp/roadmap-studio.b64

          echo "6b1fadf1216f1321fbe81c1274dc7b31159555a7b65688ed0a8c6dcebfecb1d0  /tmp/roadmap-studio.b64" | sha256sum -c -
          base64 -d /tmp/roadmap-studio.b64 > /tmp/roadmap-studio.zip
          echo "6462ab3abb9085f51a346bbc51bdf9e11d43259cd1db2638d538cfa9b6cedc21  /tmp/roadmap-studio.zip" | sha256sum -c -

          rm -rf roadmap-studio
          mkdir -p roadmap-studio
          unzip -q /tmp/roadmap-studio.zip -d roadmap-studio
          test -f roadmap-studio/index.html
          test -f roadmap-studio/src/main.js
          test -f roadmap-studio/src/styles.css

      - name: Commit deployed site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roadmap-studio
          if git diff --cached --quiet; then
            echo "No site changes to commit."
            exit 0
          fi
          git commit -m "Deploy Roadmap Studio V4"
          git push
